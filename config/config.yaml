# DDM (Data Delivery Manager) Configuration
# ==========================================

# ══════════════════════════════════════════════════════
# 权限控制：模块 → 可提交该模块的用户列表
# ══════════════════════════════════════════════════════
# module 为主键：一次 O(1) 查询即可判定某用户能否提交某模块。
# admins 中的用户不受此限制，可以提交所有模块。
modules:
  PCIE_CTRL:
    owners: [lisi]
  USB_PHY:
    owners: [wangshuai]
  DMA:
    owners: [w00949819]
  GPU_TOP:
    owners: [lisi]
  SPI:
    owners: [w00888888]
  CPU:
    owners: [w00949819, zhangsan]
  DDR:
    owners: [lisi, l00949820]
admins:
  - wangshuai
  - w00949819
  - zhangsan
  - lisi

# ══════════════════════════════════════════════════════
# 全局文件类型映射（所有 tag 共用）
# ══════════════════════════════════════════════════════
# release 时按此映射将文件分类到 Version/{module}/{group}/ 子目录。
# 匹配规则：去掉模块名前缀后，取最长后缀匹配，按声明顺序命中即停止。
# 未匹配到的文件放在模块根目录（向后兼容）。
file_groups:
  verilog: [".v.gz", ".v"]
  gds:     [".hier.gds", ".lvs.gds", ".gds.gz", ".final.hier.gds"]
  pg:      [".v.pg", ".pg"]

# ══════════════════════════════════════════════════════
# 共享组（多用户权限控制）
# ══════════════════════════════════════════════════════
# 所有 DDM 用户必须属于此组，运行时目录将使用 SGID 确保组内可读写。
# 目标服务器通常有 staff 或 wheel 组，开发机可按实际设置。
shared_group: staff

# ══════════════════════════════════════════════════════
# 过期锁自动清理（分钟）
# ══════════════════════════════════════════════════════
# 超过此时间的残留锁文件（如 kill -9 导致）会在下次 submit 时自动清除。
# 设为 0 则禁用自动清理，始终需要手动删除。
stale_lock_minutes: 14

# a0.outgoing 源数据根目录，支持 {user} {module} 占位符
# 每个工程师在自己的 a0.outgoing 下平铺文件（无 tag 子目录）
outgoing_root: /home/{user}/a0.outgoing/{module}

# 运行时仓库根目录
repository_root: ./repository

# 日志目录
log_dir: ./logs

# 默认 tag 配置 —— 所有模块自动继承
#
# 每个 tag 的模块配置方式（三选一）：
#   modules: [CPU, DDR]         只含指定模块
#   (不写 modules)               默认所有模块（取 modules: 节全部模块）
#   exclude_modules: [GPU_TOP]  排除特定模块，其余全部参与
defaults:
  tag:
    PV_ITER:
      description: 物理验证迭代版
      #modules: [CPU, DDR]
      file_patterns:
        - "{module}.v.gz"
        #- "{module}.pi.hier.gds.gz"
        - "{module}.v.pg"
      gates:
        - name: verilog_syntax_check
          command: python3 -m ddm.gates.verilog_check
        - name: drc_baseline_check
          command: python3 -m ddm.gates.drc_check
      release_users:
        - w00949819

    LVS_PASS:
      description: LVS 验证通过版
      modules: [CPU, DDR]
      file_patterns:
        - "{module}.lvs.v.gz"
        - "{module}.lvs.gds"
      gates:
        - name: lvs_integrity_check
          command: python3 -m ddm.gates.lvs_check
      release_users:
        - wangshuai

    BASE_CLEAN:
      description: Base DRC Clean 版
      modules: [CPU, DDR]
      file_patterns:
        - "{module}.base.v.gz"
        - "{module}.base.gds"
      gates:
        - name: drc_baseline_check
          command: python3 -m ddm.gates.drc_check
      release_users:
        - wangshuai

    PV_FINAL:
      description: 物理验证最终版
      modules: [CPU, DDR]
      file_patterns:
        - "{module}.final.v.gz"
        - "{module}.final.hier.gds"
      gates:
        - name: final_integrity_check
          command: python3 -m ddm.gates.final_check
      release_users:
        - w00949819

    PI_ITER:
      description: 工艺改进迭代版
      modules: [CPU, DDR]
      file_patterns:
        - "{module}.pi.v.pg"
        - "{module}.pi.hier.gds.gz"
      gates:
        - name: pi_iter_check
          command: python3 -m ddm.gates.pi_check
      release_users:
        - wangshuai

    PI_FINAL:
      description: PI 最终版
      modules: [CPU, DDR]
      file_patterns:
        - "{module}.pi.final.v.pg"
        - "{module}.pi.final.gds.gz"
      gates:
        - name: pi_final_check
          command: python3 -m ddm.gates.pi_final_check
      release_users:
        - wangshuai
